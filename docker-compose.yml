services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/recruitment.db
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-secret-key-change-me}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173}
      - SEED_ADMIN_EMAIL=${SEED_ADMIN_EMAIL:-admin@example.com}
      - SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD:-admin@123}
      - SEED_REVIEWER_EMAIL=${SEED_REVIEWER_EMAIL:-reviewer@example.com}
      - SEED_REVIEWER_PASSWORD=${SEED_REVIEWER_PASSWORD:-reviewer@123}
    volumes:
      - backend_data:/app/data

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    depends_on:
      - backend

volumes:
  backend_data:
